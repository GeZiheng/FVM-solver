# Build and test the project on Linux and Windows.
# Dependencies are declared in vcpkg.json and resolved in manifest mode, which
# only happens when CMake is configured with the vcpkg toolchain file.
#
# The Linux leg additionally builds the pyfvm extension
# (FVM_BUILD_PYTHON=ON), which unlocks two more test layers in the same
# build tree: the pyfvm_tests binding contracts and the application
# regression subset (full example cases with accuracy thresholds,
# selected by the application_default ctest label).  A manual full run
# over every application entry is available through workflow_dispatch.
name: CMake Build and Test

on:
  # Runs on every pull request, on any base branch.
  pull_request:
  workflow_dispatch:
    inputs:
      run_full:
        description: 'Run all application tests instead of the default subset'
        type: boolean
        default: false

# The build only needs to read the repository.
permissions:
  contents: read

# Cancel a run that was superseded by a newer push to the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  # Must match "builtin-baseline" in vcpkg.json. The runner checks out this
  # exact vcpkg commit, so the ports used in CI match the manifest.
  VCPKG_BASELINE: b40f8d253202fec83a5543c869aa7576b7cfdd2f
jobs:
  build:
    # Stable check names: the runner image can change without breaking the
    # required status checks configured in the repository ruleset.
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # 30 minutes covered the C++-only build.  The Linux leg now also
    # builds pyfvm and runs the application subset, and a cold run still
    # compiles the vcpkg dependencies; fail instead of burning the
    # 6-hour default.
    timeout-minutes: 45
    strategy:
      # Report the other platform as well if one of them fails.
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            python: true
          - name: windows-msvc
            os: windows-latest
            python: false

    steps:
    - uses: actions/checkout@v7

    # The pyfvm extension is version-locked to the interpreter found at
    # configure time; pin one so CMake does not pick a different python
    # that happens to be on the runner PATH.
    - uses: actions/setup-python@v5
      if: matrix.python
      with:
        python-version: '3.12'

    # Binary cache: stores the packages vcpkg built for vcpkg.json, so an
    # unchanged dependency set is downloaded instead of compiled again.
    # Keyed per OS because the archives are platform and compiler specific.
    - name: Restore vcpkg binary cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/vcpkg-bincache
        key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-

    - name: Setup vcpkg (Linux)
      if: runner.os == 'Linux'
      run: |
        git init --quiet "$VCPKG_ROOT"
        git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
        git -C "$VCPKG_ROOT" fetch --depth 1 --quiet origin "$VCPKG_BASELINE"
        git -C "$VCPKG_ROOT" checkout --quiet --detach FETCH_HEAD
        "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

    - name: Setup vcpkg (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        git init --quiet $env:VCPKG_ROOT
        git -C $env:VCPKG_ROOT remote add origin https://github.com/microsoft/vcpkg.git
        git -C $env:VCPKG_ROOT fetch --depth 1 --quiet origin $env:VCPKG_BASELINE
        git -C $env:VCPKG_ROOT checkout --quiet --detach FETCH_HEAD
        & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

    - name: Configure CMake
      env:
        # "clear;" drops the other binary sources so that only the shared
        # filesystem cache below is read from and written to.
        VCPKG_BINARY_SOURCES: 'clear;files,${{ runner.temp }}/vcpkg-bincache,readwrite'
      run: >
        cmake
        -B ${{ github.workspace }}/build
        -S ${{ github.workspace }}
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
        ${{ matrix.python && '-DFVM_BUILD_PYTHON=ON -DPython_EXECUTABLE="$(which python)"' || '' }}

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }} --parallel

    - name: Test (unit layer)
      working-directory: ${{ github.workspace }}/build
      # --no-tests=error fails the step if no test was registered at all.
      run: >
        ctest -C ${{ env.BUILD_TYPE }} -LE application
        --output-on-failure --no-tests=error

    - name: Test (application default subset)
      if: matrix.python
      working-directory: ${{ github.workspace }}/build
      # The subset membership lives in the application_default ctest label
      # set in CMakeLists.txt (one entry per physics family / code path).
      run: |
        if [ "${{ inputs.run_full }}" = "true" ]; then
          ctest -C ${{ env.BUILD_TYPE }} -L application --output-on-failure --no-tests=error
        else
          ctest -C ${{ env.BUILD_TYPE }} -L application_default --output-on-failure --no-tests=error
        fi

